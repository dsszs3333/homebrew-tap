name: Homebrew

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: Install and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_MAKE_JOBS: "2"
    steps:
      - name: Diagnose Linux Homebrew setup
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
          GITHUB_STATE: ${{ runner.temp }}/homebrew-setup-state
        run: |
          script="$RUNNER_TEMP/setup-homebrew.sh"
          log="$RUNNER_TEMP/setup-homebrew.log"
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/Homebrew/actions/1f8e202ffddf94def7f42f6fa3a482e821489f9c/setup-homebrew/main.sh --output "$script"
          if bash "$script" false false false "" true "" true >"$log" 2>&1; then
            echo '::notice::Homebrew setup succeeded'
          else
            detail="$(tail -n 50 "$log")"
            detail="${detail//'%'/'%25'}"
            detail="${detail//$'\n'/'%0A'}"
            detail="${detail//$'\r'/'%0D'}"
            printf '::error title=Homebrew setup failure::%s\n' "$detail"
            exit 1
          fi
      - name: Audit formula
        run: brew audit --strict --online dsszs3333/tap/gitlab-beacon
      - name: Install release from source
        run: brew install --build-from-source --no-ask dsszs3333/tap/gitlab-beacon
      - name: Test installed package
        run: brew test dsszs3333/tap/gitlab-beacon
      - name: Check library dependencies
        run: brew linkage --test dsszs3333/tap/gitlab-beacon
